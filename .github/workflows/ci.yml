name: Verify JobNester
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          {
            POSTGRES_DB: jobnester,
            POSTGRES_USER: jobnester,
            POSTGRES_PASSWORD: test_password,
          }
        ports: [5433:5432]
        options: --health-cmd "pg_isready -U jobnester" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6380:6379]
    env:
      DATABASE_URL: postgresql://jobnester:test_password@localhost:5433/jobnester
      REDIS_URL: redis://localhost:6380
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:generate && npm run db:migrate
      - run: npm run typecheck && npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
