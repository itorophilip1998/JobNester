name: Verify JobNester
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          {
            POSTGRES_DB: jobnester,
            POSTGRES_USER: jobnester,
            POSTGRES_PASSWORD: test_password,
          }
        ports: [5433:5432]
        options: --health-cmd "pg_isready -U jobnester" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6380:6379]
    env:
      DATABASE_URL: postgresql://jobnester:test_password@localhost:5433/jobnester
      REDIS_URL: redis://localhost:6380
      NEXT_TELEMETRY_DISABLED: 1
      AI_SERVICE_URL: http://localhost:8000
      AI_SERVICE_TOKEN: ci-service-token-only
      NEXT_PUBLIC_API_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r apps/ai/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: apps/ai
      - run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/jobnester-ai.log 2>&1 &
          curl --retry 20 --retry-delay 1 --retry-connrefused --fail http://localhost:8000/health
        working-directory: apps/ai
      - run: npm ci
      - run: npm run db:generate && npm run db:migrate
      - run: npm run typecheck && npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
