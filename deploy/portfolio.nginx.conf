# Example public portfolio host. Add your TLS and real hostname configuration.
# Serve the same export as the dashboard, but make the public portfolio its home.
server {
 listen 80;
 server_name yourdomain.com www.yourdomain.com;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 location = / { try_files /portfolio.html =404; }
 location = /portfolio { try_files /portfolio.html =404; }
 location = /portfolio/ { try_files /portfolio.html =404; }
 location /_next/ { try_files $uri =404; }
 location / { return 404; }
}
