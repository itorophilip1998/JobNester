services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobnester
      POSTGRES_USER: jobnester
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobnester_local_only}
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobnester"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports: ["127.0.0.1:6380:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    profiles: ["full"]
    build: { context: ., target: runtime }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://jobnester:${POSTGRES_PASSWORD:-jobnester_local_only}@db:5432/jobnester
      REDIS_URL: redis://redis:6379
    command:
      [
        "sh",
        "-c",
        "npm run db:migrate && npm run db:seed && npm run start -w @jobnester/api",
      ]
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
  worker:
    profiles: ["full"]
    build: { context: ., target: runtime }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://jobnester:${POSTGRES_PASSWORD:-jobnester_local_only}@db:5432/jobnester
      REDIS_URL: redis://redis:6379
    command: ["npm", "run", "start", "-w", "@jobnester/worker"]
    depends_on: [api]
    restart: unless-stopped
  web:
    profiles: ["full"]
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports: ["127.0.0.1:3000:80"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
